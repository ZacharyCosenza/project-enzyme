[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-enzyme"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4",
    "pandas>=2.3",
    "scipy>=1.17",
    "scikit-learn>=1.8",
    "transformers>=5.6",
    "tqdm>=4.67",
    "pyyaml>=6.0",
    "biopython>=1.84",
    "peft>=0.10",
]

[project.scripts]
run = "run:main"
preprocess = "preprocess:main"

[project.optional-dependencies]
# Install torch separately — XPU build requires --index-url https://download.pytorch.org/whl/xpu
# pip install torch==2.10.0+xpu torchvision==0.25.0+xpu torchaudio==2.10.0+xpu \
#     --index-url https://download.pytorch.org/whl/xpu

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
