[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-enzyme"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "transformers",
    "tqdm",
    "pyyaml",
    "biopython",
    "peft",
    "optuna",
]

[project.scripts]
run = "run:main"
preprocess = "preprocess:main"

[project.optional-dependencies]
# Install torch separately — XPU build requires --index-url https://download.pytorch.org/whl/xpu
# pip install torch==2.10.0+xpu torchvision==0.25.0+xpu torchaudio==2.10.0+xpu \
#     --index-url https://download.pytorch.org/whl/xpu

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
